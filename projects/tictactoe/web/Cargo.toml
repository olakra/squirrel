[package]
name = "tictactoe-web"
version.workspace = true
edition = "2021"
description = "WebAssembly wrapper around the tic-tac-toe core for the browser front end"
license = "UNLICENSED"
publish = false

# cdylib produces the .wasm file for the browser. rlib lets the host test the
# plain conversion helpers in convert.rs without a browser.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tictactoe-core = { path = "../core" }
# Exact pin. The wasm-bindgen CLI in CI (.github/workflows/ci.yml, WASM_BINDGEN_VERSION)
# must be the same version, or the generated glue does not match the .wasm file.
wasm-bindgen = "=0.2.100"
