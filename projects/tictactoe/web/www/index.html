<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The title and every visible string come from i18n/en.json, set by main.js. -->
    <title></title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page">
      <h1 data-i18n="app.heading"></h1>

      <!-- Polite live region: main.js writes each turn, result and refused move here. -->
      <p id="status" class="status" aria-live="polite"></p>

      <div id="board" class="board" role="group" data-i18n-aria-label="board.label">
        <!-- The cell buttons are added by main.js. The win line is drawn over them. -->
        <svg id="win-layer" class="win-line" viewBox="0 0 3 3" aria-hidden="true" focusable="false" hidden>
          <line id="win-line" x1="0" y1="0" x2="0" y2="0" pathLength="1"></line>
        </svg>
      </div>

      <button id="reset" class="button" type="button" data-i18n="action.reset"></button>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
