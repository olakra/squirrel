# Local pre-commit hooks. Install once with: pre-commit install
# The same checks run in CI, so a hook failure here is a CI failure avoided.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check (axiom)
        entry: bash -c 'cd projects/axiom && cargo fmt --all -- --check'
        language: system
        pass_filenames: false
        files: '^projects/axiom/.*\.rs$'

      - id: cargo-clippy
        name: cargo clippy -D warnings (axiom)
        entry: bash -c 'cd projects/axiom && cargo clippy --all-targets --all-features -- -D warnings'
        language: system
        pass_filenames: false
        files: '^projects/axiom/.*\.(rs|toml)$'

      - id: markdownlint
        name: markdownlint-cli2
        entry: npx --yes markdownlint-cli2@0.23.2
        language: system
        types: [markdown]
