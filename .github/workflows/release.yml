# Release pipeline. Runs when a release tag such as axiom-v0.2.0 or tictactoe-v0.1.0 is pushed.
# Tags are "<project>-vMAJOR.MINOR.PATCH[-prerelease]"; the projects are listed in
# scripts/release/projects.sh.
#
# Order: verify (tag rules; outputs project and version) -> ci (make ci, the same gates as
# ci.yml) -> build (make release-artifacts: files and SHA256SUMS) -> release (waits for approval
# in the "production" environment, then attests and publishes the GitHub release).
#
# The runbook is docs/engineering/release-process.md. Never create the release in the GitHub UI:
# this workflow must create it, or the files and attestation are not attached.
# Tags are never moved or deleted: see docs/engineering/tag-protection.md.
name: Release

on:
  push:
    tags: ["*-v*.*.*"]

# No token rights at the top level. Each job grants only what it needs.
permissions: {}

# One release run per tag at a time. A running release is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # Fails unless the tag is an annotated <project>-vX.Y.Z tag that equals the project's version
    # files, has a CHANGELOG section, sits on main or the project's support branch, and has no
    # release yet.
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      project: ${{ steps.check.outputs.project }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: fetch main and the support branches for the reachability check
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin '+refs/heads/support/*:refs/remotes/origin/support/*' || true
      - name: check the tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/check-release-tag.sh "$GITHUB_REF_NAME"

  ci:
    # The same gates as ci.yml, run through make so the commands are not copied.
    name: make ci
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: install Rust components and targets
        run: |
          rustup component add rustfmt clippy llvm-tools-preview
          rustup target add wasm32-unknown-unknown
          rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-deny
      - name: make ci
        run: make ci

  build:
    # Builds the project's release files with the same script as `make release-artifacts`.
    name: build ${{ needs.verify.outputs.project }}
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PROJECT: ${{ needs.verify.outputs.project }}
      VERSION: ${{ needs.verify.outputs.version }}
      # Must equal the exact pin of wasm-bindgen in projects/tictactoe/web/Cargo.toml.
      WASM_BINDGEN_VERSION: 0.2.100
    steps:
      - uses: actions/checkout@v7
      - name: install toolchains
        run: |
          rustup target add wasm32-unknown-unknown
          rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown
      - name: install wasm-bindgen-cli (tictactoe only)
        if: env.PROJECT == 'tictactoe'
        run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - name: make release-artifacts
        run: make release-artifacts PROJECT="$PROJECT" VERSION="$VERSION"
      - name: upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error

  release:
    # Waits for a reviewer in the "production" environment (docs/engineering/branch-protection.md).
    name: publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write       # create the GitHub release and upload its files
      id-token: write       # sign the build provenance attestation
      attestations: write   # store the attestation
    env:
      PROJECT: ${{ needs.verify.outputs.project }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist
      - name: verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: extract release notes from the project's CHANGELOG
        run: |
          source scripts/release/projects.sh
          bash scripts/ci/extract-changelog.sh "$VERSION" "$(release_changelog "$PROJECT")" > release-notes.md
      - name: attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source scripts/release/projects.sh
          flags=()
          case "$VERSION" in
            *-*) flags+=(--prerelease --latest=false) ;;
            *)
              # One "Latest" release per repository: only the primary project's stable releases.
              if [[ "$PROJECT" == "$RELEASE_PRIMARY_PROJECT" ]]; then
                flags+=(--latest)
              else
                flags+=(--latest=false)
              fi
              ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$PROJECT v$VERSION" \
            --notes-file release-notes.md \
            "${flags[@]}" \
            dist/*
