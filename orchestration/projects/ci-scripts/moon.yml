# ci-scripts: the governance and release scripts in scripts/ci and scripts/release. release-verify
# reads each project's version and changelog, so this project depends on axiom-core.
# Decision record: docs/engineering/adr/0003-monorepo-orchestration.md.
$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'bash'

project:
  name: 'ci-scripts'
  description: 'Commit, changelog, tag and benchmark checks used by CI and by the release pipeline.'

dependsOn:
  - 'axiom-core'

fileGroups:
  sources:
    - '/scripts/ci/**/*.sh'
    - '/scripts/release/**/*.sh'
  release-inputs:
    - '/projects/axiom/Cargo.toml'
    - '/projects/axiom/CHANGELOG.md'
    - '/projects/tictactoe/Cargo.toml'
    - '/projects/tictactoe/CHANGELOG.md'

tasks:
  check:
    script: |
      bash -n scripts/ci/*.sh scripts/release/*.sh
    inputs:
      - '@group(sources)'
    options:
      runFromWorkspaceRoot: true

  test:
    script: |
      bash scripts/ci/check-commit-messages.sh --self-test
      bash scripts/ci/check-changelog.sh --self-test
      bash scripts/ci/extract-changelog.sh --self-test
      bash scripts/ci/check-release-tag.sh --self-test
      bash scripts/ci/check-branch-name.sh --self-test
    inputs:
      - '@group(sources)'
    options:
      runFromWorkspaceRoot: true

  release-verify:
    # Local mode for axiom, the same as `make release-check PROJECT=axiom`. It tags nothing.
    # Other projects use `make release-check PROJECT=<id>`. CI mode (the verify job in release.yml)
    # needs the tag name and GH_TOKEN, and is not wired to this task yet.
    script: |
      bash scripts/ci/check-release-tag.sh --local axiom
    inputs:
      - '@group(sources)'
      - '@group(release-inputs)'
    options:
      runFromWorkspaceRoot: true
