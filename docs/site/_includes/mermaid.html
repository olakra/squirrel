<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  // Turns every code block tagged with the language-mermaid class into a diagram. If the CDN script
  // did not load, the block stays on the page as readable source.
  (function () {
    if (typeof mermaid === "undefined") { return; }
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: dark ? "dark" : "default" });
    var nodes = [];
    Array.prototype.forEach.call(document.querySelectorAll("pre > code.language-mermaid"), function (code) {
      var div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = code.textContent;
      code.parentNode.replaceWith(div);
      nodes.push(div);
    });
    if (nodes.length) {
      mermaid.run({ nodes: nodes }).catch(function (err) { console.error("Mermaid render failed", err); });
    }
  })();
</script>
